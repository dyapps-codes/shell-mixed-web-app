<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #fcfbf8; color: #1d1e24; }
      #first-paint { min-height: 100vh; background: #fcfbf8; }
      #first-paint header {
        height: 64px;
        border-bottom: 1px solid rgba(29, 30, 36, 0.08);

    </style>
  </head>

    <!-- First paint is the page, not a loader. Never add #splash / Loading. -->

      <div id="first-paint">
        <header></header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
